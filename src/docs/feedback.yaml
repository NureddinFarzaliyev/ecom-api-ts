tags: 
  - name: Feedbacks
    description: Operations related to user feedback 
paths:
  /feedbacks:
    get:
      summary: Get all feedbacks
      tags:
        - Feedbacks
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of custom orders per page
        - in: query
          name: q
          schema:
            type: string
          description: Search query for name, surname and unique code
      responses:
        "200":
          description: List of feedbacks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      summary: Create new feedback
      tags:
        - Feedbacks
      requestBody:
        required: true
        content:
          application/json:
            examples:
              guest:
                summary: Guest user feedback
                value:
                  guest:
                    name: "John"
                    surname: "Doe"
                    email: "john@example.com"
                    phoneNumber: "+123456789"
                  content: "Great service, I really enjoyed shopping!"
              loggedInUser:
                summary: Logged-in user feedback
                value:
                  content: "Please add more payment options."
      responses:
        "201":
          description: Created feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /feedbacks/config:
    get:
      summary: Get feedback configuration
      tags:
        - Feedbacks
      responses:
        "200":
          description: Feedback configuration
  /feedbacks/{id}:
    get:
      summary: Get single feedback by ID
      tags:
        - Feedbacks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    patch:
      summary: Edit feedback content
      tags:
        - Feedbacks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            examples:
              editContent:
                value:
                  content: "Updated feedback content goes here."
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
    delete:
      summary: Delete feedback by ID
      tags:
        - Feedbacks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback deleted successfully
  /feedbacks/{id}/response:
    patch:
      summary: Respond to feedback (admin only)
      tags:
        - Feedbacks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            examples:
              respondFeedback:
                value:
                  response: "Thank you for your feedback. We’ll improve this."
                  status: "reviewed"
      responses:
        "200":
          description: Feedback response updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Feedback:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
        userId:
          type: string
          nullable: true
        guest:
          type: object
          nullable: true
          properties:
            name: { type: string }
            surname: { type: string }
            email: { type: string }
            phoneNumber: { type: string }
        content:
          type: string
        response:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, resolved]
        respondedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
